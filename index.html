<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RDR на 100%</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#141513">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RDR 100%">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one-column field ledger. A sticky chapter rail on top; every achievement is a ledger row
   carrying a 9-cell "window" track (chapters 1–6, epilogue I–II, after the finale). */
:root{
  --bg:#E8E9E3; --paper:#F7F7F2; --ink:#1B1D1A; --muted:#5C6058; --line:#CBCEC4;
  --accent:#8A5A12; --accent-soft:#EFE3CB; --on-accent:#FFFDF7;
  --danger:#A2261E; --danger-soft:#F4DCD8;
  --ok:#356440; --ok-soft:#D9E8DB;
  --cool:#3F5573; --cool-soft:#DCE3EE;
  --map-bg:#D7D9D0; --road:#9C907A;
  --mk-animal:#8A4B2A; --mk-plant:#3E7A4A; --mk-str:#6A4C8C; --mk-serv:#5D6670;
  --z0:#C2410C; --z1:#1D6FA8; --z2:#7C3AED; --z3:#0F7B5A; --z4:#B91C5C; --z5:#8A6A00;
  --st-am:#E8ECF1; --st-nh:#E8EFE2; --st-le:#F1E6E2; --st-we:#EEEBDC; --st-na:#F0E3D0; --st-np:#F2DAB8; --mk-un:#4F6B3A;
  --f-display:"Old Standard TT","Times New Roman",Georgia,serif;
  --f-label:"Oswald","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"PT Sans","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111210; --paper:#191A18; --ink:#E9E7DE; --muted:#9C9F95; --line:#30322D;
    --accent:#D8A64A; --accent-soft:#33291A; --on-accent:#1A1408;
    --danger:#E5604F; --danger-soft:#3A1D19;
    --ok:#88BC93; --ok-soft:#1D3123;
    --cool:#9FB4D3; --cool-soft:#1E2633;
    --map-bg:#0B0C0A; --road:#5E584A;
    --mk-animal:#D08A62; --mk-plant:#7CC08A; --mk-str:#B39AD6; --mk-serv:#9AA4AE;
    --z0:#FB923C; --z1:#60A5FA; --z2:#C4B5FD; --z3:#34D399; --z4:#F472B6; --z5:#FACC15;
    --st-am:#1A1F26; --st-nh:#1B2219; --st-le:#271D1B; --st-we:#24221A; --st-na:#2A2117; --st-np:#2F2014; --mk-un:#93B47A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111210; --paper:#191A18; --ink:#E9E7DE; --muted:#9C9F95; --line:#30322D;
  --accent:#D8A64A; --accent-soft:#33291A; --on-accent:#1A1408;
  --danger:#E5604F; --danger-soft:#3A1D19;
  --ok:#88BC93; --ok-soft:#1D3123;
  --cool:#9FB4D3; --cool-soft:#1E2633;
  --map-bg:#0B0C0A; --road:#5E584A;
  --mk-animal:#D08A62; --mk-plant:#7CC08A; --mk-str:#B39AD6; --mk-serv:#9AA4AE;
    --z0:#FB923C; --z1:#60A5FA; --z2:#C4B5FD; --z3:#34D399; --z4:#F472B6; --z5:#FACC15;
  --st-am:#1A1F26; --st-nh:#1B2219; --st-le:#271D1B; --st-we:#24221A; --st-na:#2A2117; --st-np:#2F2014; --mk-un:#93B47A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{padding-block:28px 18px;display:grid;gap:10px}
.eyebrow{margin:0;font:500 12px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;flex:none;border-radius:12px;display:block}
.xfer{display:grid;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.xfer p{margin:0;font-size:14px;color:var(--muted)}
.xfer textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;padding:8px}
.xfer-row{display:flex;flex-wrap:wrap;gap:8px}
h1{margin:0;font:700 clamp(30px,8vw,44px)/1.02 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;font-weight:400;color:var(--accent)}
.lede{margin:0;color:var(--muted);max-width:52ch}
.tally{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:6px}
.tally div{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px}
.num{font:600 26px/1 var(--f-label);font-variant-numeric:tabular-nums}
.of{font:400 15px/1 var(--f-label);color:var(--muted);font-variant-numeric:tabular-nums}
.lab{flex-basis:100%;font:500 11px/1.4 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}

/* Dock: tabs + chapter rail */
.dock{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.dock-in{max-width:760px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 10px;display:grid;gap:8px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:7px;padding:7px 8px;font:500 13px/1.2 var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:440px){.tabs button{letter-spacing:.02em;font-size:12px;padding:7px 2px}}
.fp-done{display:flex;justify-content:flex-end}
.rail-lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:500 11px/1 var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.ph{position:relative;border:1px solid var(--line);background:var(--paper);border-radius:8px;height:40px;cursor:pointer;font:600 16px/1 var(--f-label);font-variant-numeric:tabular-nums;padding:0}
.ph[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ph .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--danger)}
.ph[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--accent)}
.cap{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.cap-name{font:700 19px/1.2 var(--f-display)}
.cap-place{font-style:italic;color:var(--muted);font-family:var(--f-display)}
.cap-hot{margin-left:auto;font:500 12px/1.2 var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--danger)}
.cap-hot.calm{color:var(--ok)}

/* Sections */
main{padding-block:18px 8px;display:grid;gap:22px}
.sec{display:grid;gap:8px}
.sec-h{display:flex;align-items:baseline;gap:10px}
.sec-h h2{margin:0;font:600 14px/1.2 var(--f-label);letter-spacing:.12em;text-transform:uppercase}
.sec-urgent .sec-h h2{color:var(--danger)}
.count{font:500 12px/1 var(--f-label);font-variant-numeric:tabular-nums;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.sec-sub{margin:-2px 0 2px;color:var(--muted);font-size:14px}
.rows{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rows > * + *{border-top:1px solid var(--line)}
.sec-urgent .rows{border-color:var(--danger)}
.calm-msg{margin:0;padding:14px 16px;color:var(--muted);font-style:italic;font-family:var(--f-display);font-size:17px}
details.fold > summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:2px 0}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary h2{margin:0;font:600 14px/1.2 var(--f-label);letter-spacing:.12em;text-transform:uppercase}
details.fold > summary::after{content:"Показать";margin-left:auto;font:500 12px/1 var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
details.fold[open] > summary::after{content:"Скрыть"}
details.fold[open] > summary{margin-bottom:8px}

/* Card */
.card{padding:12px 12px 12px 10px;display:grid;gap:10px}
.card-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.tick{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;padding:0}
.tick svg{width:20px;height:20px;opacity:0}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.tick[aria-pressed="true"] svg{opacity:1;stroke:var(--paper)}
.is-urgent .tick{border-color:var(--danger)}
.card-head{display:grid;gap:6px;text-align:left;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.names{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.ru{font:700 18px/1.2 var(--f-display)}
.is-done .ru{color:var(--muted)}
.en{font-size:13px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.b{font:500 11px/1 var(--f-label);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.b-miss{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.b-story{background:var(--cool-soft);color:var(--cool);border-color:transparent}
.b-post{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.b-disp{border-color:var(--accent);color:var(--accent);background:transparent}
.b-lost{background:var(--danger);color:var(--paper);border-color:var(--danger)}
.b-done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pct{font:400 12px/1 var(--f-label);color:var(--muted);font-variant-numeric:tabular-nums}
.stamp{justify-self:start;font:600 11px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--danger);border:1.5px solid var(--danger);border-radius:3px;padding:4px 7px;transform:rotate(-1.5deg)}

/* Window track */
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;max-width:330px}
.tc{height:18px;border-radius:3px;border:1px dashed var(--line);display:grid;place-items:center;font:500 9px/1 var(--f-label);color:var(--muted);font-variant-numeric:tabular-nums}
.tc.in{border:1px solid transparent;background:var(--cool-soft);color:var(--cool)}
.tc.best{background:var(--accent);color:var(--on-accent)}
.tc.end{background:var(--danger);color:var(--paper)}
.tc.now{box-shadow:inset 0 0 0 2px var(--ink)}

/* Inline steps + details */
.steps{display:grid;gap:2px;margin-left:52px}
.step{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;padding:5px 0;font-size:15px;cursor:pointer}
.step input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ok)}
.step.is-checked span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.step .lost{display:inline-block;margin-left:6px;font:500 10px/1 var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--danger);border:1px solid var(--danger);border-radius:3px;padding:2px 4px;vertical-align:1px}
.sp-btn{border:1px dashed var(--line);background:repeating-linear-gradient(135deg,var(--bg) 0 6px,transparent 6px 12px);border-radius:6px;padding:6px 10px;text-align:left;cursor:pointer;color:var(--muted);font-size:14px}
.detail{margin-left:52px;display:grid;gap:14px;padding-top:4px;border-top:1px dashed var(--line);padding-block:12px 4px;min-width:0}
.detail h4{margin:0 0 4px;font:600 12px/1.2 var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.detail p{margin:0;max-width:62ch}
.when{font-size:15px}
.when strong{font-weight:700}
.tips{margin:0;padding-left:18px;display:grid;gap:6px;max-width:62ch}
.tips li::marker{color:var(--accent)}
.sg{display:grid;gap:0}
.sg-h{font:600 12px/1.2 var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--cool);margin-top:6px}
.sg-h .now-tag{color:var(--accent)}
.box{border-radius:8px;padding:10px 12px;font-size:14px;max-width:62ch}
.box-warn{background:var(--accent-soft);color:var(--ink)}
.box-note{background:var(--bg);border:1px solid var(--line)}
.box-lost{background:var(--danger-soft)}
.box strong{font-family:var(--f-label);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:12px;display:block;margin-bottom:2px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;text-decoration:none;background:var(--bg)}
.links a::after{content:" ↗";color:var(--muted)}
.src{font-size:12px;color:var(--muted)}
.card{scroll-margin-top:190px}

/* Map */
.maptools{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.maptools .chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.maptools .chip .cnt{color:inherit;opacity:.7;font-variant-numeric:tabular-nums}
.maptools .sep{flex:none;width:1px;background:var(--line);margin:2px 2px}
.lg{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font:600 10px/1 var(--f-label);flex:none}
.lg.c-camp{border-radius:4px}
.mapbox{position:relative;height:min(66vh,580px);min-height:340px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--map-bg);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.mapbox.is-drag{cursor:grabbing}
.mapsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ar{stroke:none}
.ar-am{fill:var(--st-am)} .ar-nh{fill:var(--st-nh)} .ar-le{fill:var(--st-le)} .ar-we{fill:var(--st-we)} .ar-na{fill:var(--st-na)} .ar-np{fill:var(--st-np)} .db{fill:none;stroke:var(--road);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke;opacity:.7}
.roads path{fill:none;stroke:var(--road);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.rail{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:5 3;vector-effect:non-scaling-stroke;opacity:.5}
.mapov{position:absolute;inset:0;pointer-events:none;transform-origin:0 0;will-change:transform}
.mapov > *{position:absolute;left:0;top:0}
.lbl{white-space:nowrap;color:var(--ink);text-shadow:0 0 2px var(--paper),0 0 4px var(--paper),0 0 6px var(--paper)}
.mapov > .lbl-town{font:700 12px/1 var(--f-display);display:flex;align-items:center;gap:4px}
.lbl-town i{width:7px;height:7px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px var(--paper);flex:none}
.lbl-district{font:italic 400 12px/1 var(--f-display);color:var(--muted)}
.lbl-state{font:500 12px/1 var(--f-label);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.mapbox[data-zoom="far"] .lbl-district{display:none}
.mapbox[data-zoom="near"] .lbl-state{display:none}
.mapbox[data-zoom="far"] .lbl-town{font-size:11px}
.mk{pointer-events:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);display:grid;place-items:center;font:600 12px/1 var(--f-label);cursor:pointer;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.mapbox[data-zoom="far"] .mk{width:20px;height:20px;font-size:10px;border-width:1.5px}
.c-coll{background:var(--accent);color:var(--on-accent)}
.c-place{background:var(--cool);color:var(--paper)}
.c-risk{background:var(--danger);color:var(--paper)}
.c-camp{background:var(--ink);color:var(--paper)}
.mk.c-camp{border-radius:6px}
.mk.is-found,.lg.is-found{background:var(--ok);color:var(--paper)}
.mk.is-later{opacity:.42}
.mk.is-now{box-shadow:0 0 0 3px var(--accent),0 1px 3px rgba(0,0,0,.35)}
.mk.is-sel{outline:3px solid var(--ink);outline-offset:2px;z-index:3}
.ring{border:1.5px dashed var(--ink);border-radius:50%;opacity:.5;pointer-events:none}
.mapctl{position:absolute;right:10px;top:10px;display:grid;gap:6px;z-index:4}
.mapctl button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font:500 19px/1 var(--f-label);cursor:pointer;color:var(--ink);display:grid;place-items:center;padding:0}
.mapcard{position:absolute;left:10px;right:10px;bottom:10px;z-index:5;max-height:56%;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);cursor:auto;touch-action:pan-y;user-select:text;-webkit-user-select:text;font-size:15px}
@media (min-width:640px){.mapcard{right:auto;width:340px}}
.mp-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
.mp-head h3{margin:0;font:700 17px/1.2 var(--f-display)}
.mp-sub{margin:2px 0 0;font:500 11px/1.3 var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mk-static{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 12px/1 var(--f-label)}
.mp-x{border:0;background:transparent;font:400 22px/1 var(--f-body);color:var(--muted);cursor:pointer;width:32px;height:32px;margin:-6px -8px 0 0}
.mapcard p{margin:0}
.mp-h{margin:0 0 4px;font:600 11px/1.2 var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.achlink{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:14px;cursor:pointer;color:var(--ink)}
.map-cap{margin:0;font-size:13px;color:var(--muted);max-width:66ch}
.c-animal{background:var(--mk-animal);color:var(--paper)}
.c-plant{background:var(--mk-plant);color:var(--paper)}
.c-str{background:var(--mk-str);color:var(--paper)}
.c-serv{background:var(--mk-serv);color:var(--paper)}
.mk.dot{width:13px;height:13px;border-width:1.5px;font-size:0;position:absolute}
.mk.dot::after{content:"";position:absolute;inset:-8px}
.mapbox[data-zoom="far"] .mk.dot{width:9px;height:9px;border-width:1px}
.mapbox[data-zoom="far"] .mk.dot.is-found,.mk.dot.is-found{background:var(--ok)}
.lg.dot{width:10px;height:10px;border-radius:50%}
.mk-static.sq{border-radius:6px}
.mapbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.fpanel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:12px}
.fp-presets{display:flex;flex-wrap:wrap;gap:6px}
.fg{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
.fg legend{padding:0;margin-bottom:6px;font:600 12px/1.2 var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fg-list{display:flex;flex-wrap:wrap;gap:6px}
.fg-list .chip{display:inline-flex;align-items:center;gap:6px}
.fg-list .chip .cnt{opacity:.7;font-variant-numeric:tabular-nums}
.spk-d{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.spk-d summary{cursor:pointer;padding:9px 12px;font:500 13px/1.2 var(--f-label);letter-spacing:.06em;text-transform:uppercase}
.spk{padding:0 12px 12px;display:grid;gap:8px}
.spk-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spk-q,#zq{flex:1 1 180px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px}
.spk-list{max-height:260px;overflow:auto;display:grid;gap:0;border-top:1px solid var(--line)}
.spk-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.spk-row input{width:17px;height:17px;margin:0;accent-color:var(--accent)}
.spk-row small{color:var(--muted);font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;color:var(--accent);font:500 13px/1.2 var(--f-label);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:6px 0}
.activechips{display:flex;flex-wrap:wrap;gap:6px}
.achip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.map-meta{margin:0;font:500 12px/1 var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.zoo-tg{display:flex;flex-wrap:wrap;gap:6px}
/* Challenges */
.rules{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rules summary{cursor:pointer;font:600 13px/1.4 var(--f-label);letter-spacing:.1em;text-transform:uppercase}
.rules .tips{margin-top:8px;font-size:15px}
.setnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.setnav .chip{flex:none;white-space:nowrap}
.setnav .chip .cnt{opacity:.7;font-variant-numeric:tabular-nums}
.set-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.set-h h2{margin:0;font:700 26px/1.1 var(--f-display)}
.set-h .en{margin:2px 0 0;color:var(--muted);font-size:14px}
.set-p{display:flex;align-items:baseline;gap:6px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 14px 14px 12px}
.task.is-next{background:var(--accent-soft)}
.task-tick{display:grid;place-items:center;width:40px;height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.task-tick input{width:20px;height:20px;margin:0;accent-color:var(--ok)}
.task.is-done .task-tick{border-color:var(--ok)}
.task-b{display:grid;gap:6px;min-width:0}
.task-b h3{margin:0;font:700 17px/1.25 var(--f-display)}
.task.is-done .task-b h3{color:var(--muted)}
.task-b p{margin:0;max-width:62ch;font-size:15px}
.task-n{font:600 12px/1 var(--f-label)!important;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.task-prep{color:var(--danger)}
.task-f{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.zoo-tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.zrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
.zr-b{display:grid;gap:2px;min-width:0}
.zr-n{font:700 16px/1.2 var(--f-display)}
.zr-s{font-size:13px;color:var(--muted)}
.zr-a{display:flex;gap:4px}
.zbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 8px;font:500 12px/1 var(--f-label);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.zbtn.on{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.zbtn.map{color:var(--accent)}
.zl path{cursor:pointer;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.zd{fill:var(--zc);fill-opacity:.14;stroke:var(--zc);stroke-opacity:.7;stroke-width:1.5;stroke-dasharray:5 4}
.zh{fill:var(--zc);fill-opacity:.5;stroke:var(--zc);stroke-width:1.6}
.zc0{--zc:var(--z0)} .zc1{--zc:var(--z1)} .zc2{--zc:var(--z2)} .zc3{--zc:var(--z3)} .zc4{--zc:var(--z4)} .zc5{--zc:var(--z5)}
.zsw{width:26px;height:26px;border-radius:6px;background:var(--zc);opacity:.85;flex:none;display:inline-block}
.zsw.sm{width:12px;height:12px;border-radius:3px}
.lg.zone{border-radius:3px;opacity:.7}
.zgrp{display:grid;gap:8px;margin-top:6px}
.zgrp-h{margin:0;font:600 14px/1.2 var(--f-label);letter-spacing:.1em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline}
.zrow{align-items:start}
.zr-n small{font:400 12px var(--f-body);color:var(--muted)}
.zr-s strong{font-weight:700;color:var(--ink)}
.zr-a{flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.mapcard .badges{display:flex;flex-wrap:wrap;gap:4px}



/* Compact lists */
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:15px}
.mini li + li{border-top:1px solid var(--line)}
.mini .from{font:500 12px/1.4 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.mini .hid{color:var(--muted);font-style:italic}

/* Notices, filters, settings */
.notice{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--cool-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.notice p{margin:0;flex:1 1 220px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 12px;font:500 13px/1 var(--f-label);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn-danger.armed{background:var(--danger);color:var(--paper)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font:500 13px/1 var(--f-label);letter-spacing:.04em;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.hint{margin:0;color:var(--muted);font-size:14px}
.settings{padding-block:12px 8px;display:grid;gap:12px}
.settings h2{margin:0;font:600 14px/1.2 var(--f-label);letter-spacing:.12em;text-transform:uppercase}
.switch{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.switch small{grid-column:2;color:var(--muted);font-size:13px}
.sync{font-size:14px;color:var(--muted)}
.sync b{color:var(--ok);font-weight:700}
.foot{padding-block:18px 40px;display:grid;gap:10px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:12px}
.foot ul{margin:0;padding-left:18px;display:grid;gap:4px}
.foot p{margin:0;max-width:66ch}

  return (STATE_FROM[m.s] === m.f && STATE_OPEN[m.s]) ? STATE_OPEN[m.s] : "Откроется " + PH[m.f].when + ".";
}
function distText(it){ return it.dz.map(d => ZONES.districts[d].n).join(", "); }
function schedule(){ if (!mapFrame) mapFrame = requestAnimationFrame(() => { mapFrame = 0; applyView(); }); }
let ovBase = null, settleT = 0, selZ = null;
function computeView(){
  const cw = mapEl.clientWidth, ch = mapEl.clientHeight;
  if (!cw || !ch) return null;
  mv.w = clampW(mv.w);
  mv.cx = Math.min(Math.max(mv.cx, WB.x0), WB.x1);
  mv.cy = Math.min(Math.max(mv.cy, WB.y0), WB.y1);
  const h = mv.w * ch / cw;
  vb = {x: mv.cx - mv.w/2, y: mv.cy - h/2, w: mv.w, h, cw, ch};
  svgEl.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h);
  return vb;
}
/* Быстрый путь: во время жеста сдвигаем и масштабируем слой меток целиком, точная раскладка — после паузы. */
function applyView(){
  if (!mapEl || !mapEl.isConnected) return;
  if (!computeView()) return;
  const k = vb.cw / vb.w;
  if (ovBase && ovBase.cw === vb.cw && ovBase.ch === vb.ch){
    ovEl.style.transform = "translate(" + ((ovBase.x - vb.x) * k).toFixed(1) + "px," + ((ovBase.y - vb.y) * k).toFixed(1) + "px) scale(" + (k / ovBase.k).toFixed(4) + ")";
    clearTimeout(settleT); settleT = setTimeout(layoutOverlay, 140);
  } else layoutOverlay();
}
function layoutOverlay(){
  if (!mapEl || !mapEl.isConnected || !computeView()) return;
  mapEl.dataset.zoom = mv.w > 70 ? "far" : (mv.w < 28 ? "near" : "mid");
  const k = vb.cw / vb.w;
  for (const el of ovEl.children){
    const x = (el.dataset.x - vb.x) * k, y = (el.dataset.y - vb.y) * k;
    if (el.dataset.r){ const d = 2 * el.dataset.r * k; el.style.width = d + "px"; el.style.height = d + "px"; }
    el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) " + (el.dataset.o || "translate(-50%,-50%)");
  }
  ovEl.style.transform = "";
  ovBase = {x: vb.x, y: vb.y, k, cw: vb.cw, ch: vb.ch};
}
function fitTo(ms){
  const cw = mapEl.clientWidth || 360, ch = mapEl.clientHeight || 420;
  if (!ms || !ms.length){
    mv = {cx:(WB.x0+WB.x1)/2, cy:(WB.y0+WB.y1)/2, w: Math.max(WB.x1-WB.x0, (WB.y1-WB.y0) * cw / ch)};
    return;
  }
  const xs = ms.map(m => m.ln), ys = ms.map(m => -m.la);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  mv = {cx:(x0+x1)/2, cy:(y0+y1)/2, w: Math.max(14, (x1-x0) * 1.3, (y1-y0) * 1.3 * cw / ch)};
}
function zoneFitPoints(list){
  const out = [];
  for (const z of list) if (z.it.bb) out.push({ln: z.it.bb[0], la: -z.it.bb[1]}, {ln: z.it.bb[2], la: -z.it.bb[3]});
  return out;
}
function zoomAt(newW, sx, sy){
  const r = mapEl.getBoundingClientRect();
  const fx = (sx - r.left) / r.width - 0.5, fy = (sy - r.top) / r.height - 0.5, ratio = r.height / r.width;
  const wx = mv.cx + fx * mv.w, wy = mv.cy + fy * mv.w * ratio, nw = clampW(newW);
  mv = {cx: wx - fx * nw, cy: wy - fy * nw * ratio, w: nw};
  schedule();
}
function buildMap(){
  mapEl = document.createElement("div");
  mapEl.className = "mapbox";
  mapEl.setAttribute("role", "application");
  mapEl.setAttribute("aria-label", "Карта Red Dead Redemption с метками и зонами");
  const areas = Object.keys(MAP.areas).map(k => '<path class="ar ar-' + k + '" d="' + MAP.areas[k] + '"/>').join("") + '<path class="db" d="' + MAP.dist + '"/>';
  const roads = Object.keys(MAP.roads).map(k => '<path d="' + MAP.roads[k] + '"/>').join("");
  mapEl.innerHTML = '<svg class="mapsvg" preserveAspectRatio="none" focusable="false"><g aria-hidden="true">' + areas + '</g><g class="zl"></g><g class="roads" aria-hidden="true">' + roads + '</g><path class="rail" aria-hidden="true" d="' + MAP.rail + '"/></svg>' +
    '<div class="mapov"></div>' +
    '<div class="mapctl"><button type="button" data-act="mz" data-z="in" aria-label="Приблизить">+</button><button type="button" data-act="mz" data-z="out" aria-label="Отдалить">−</button><button type="button" data-act="mz" data-z="fit" aria-label="Показать всю карту">⤢</button></div>' +
    '<div class="mapcard" hidden></div>';
  svgEl = mapEl.querySelector("svg"); ovEl = mapEl.querySelector(".mapov"); cardEl = mapEl.querySelector(".mapcard");
  const pts = new Map(); let drag = null, pinch = null, moved = false;
  const inUi = t => t.closest(".mapctl") || t.closest(".mapcard");
  mapEl.addEventListener("pointerdown", e => {
    if (inUi(e.target)) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pts.size === 1){ drag = {x:e.clientX, y:e.clientY, cx:mv.cx, cy:mv.cy, id:e.pointerId}; moved = false; }
    else if (pts.size === 2){
      const [a, b] = [...pts.values()], r = mapEl.getBoundingClientRect();
      const fx = ((a.x+b.x)/2 - r.left) / r.width - 0.5, fy = ((a.y+b.y)/2 - r.top) / r.height - 0.5;
      pinch = {d0: Math.hypot(a.x-b.x, a.y-b.y) || 1, w: mv.w, wx: mv.cx + fx*mv.w, wy: mv.cy + fy*mv.w*r.height/r.width};
      drag = null; moved = true;
      for (const id of pts.keys()){ try { mapEl.setPointerCapture(id); } catch(_){} }
    }
  });
  mapEl.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pinch && pts.size >= 2){
      const [a, b] = [...pts.values()], r = mapEl.getBoundingClientRect();
      const nw = clampW(pinch.w * pinch.d0 / (Math.hypot(a.x-b.x, a.y-b.y) || 1));
      const fx = ((a.x+b.x)/2 - r.left) / r.width - 0.5, fy = ((a.y+b.y)/2 - r.top) / r.height - 0.5;
      mv = {cx: pinch.wx - fx*nw, cy: pinch.wy - fy*nw*r.height/r.width, w: nw};

    }
    if (drag && e.pointerId === drag.id){
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!moved && Math.hypot(dx, dy) > 6){ moved = true; try { mapEl.setPointerCapture(e.pointerId); } catch(_){} mapEl.classList.add("is-drag"); }
      if (moved){ const k = mv.w / mapEl.clientWidth; mv.cx = drag.cx - dx*k; mv.cy = drag.cy - dy*k; schedule(); }
    }
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 1){ const [id, p] = [...pts.entries()][0]; drag = {x:p.x, y:p.y, cx:mv.cx, cy:mv.cy, id}; }
    if (pts.size === 0){ drag = null; mapEl.classList.remove("is-drag"); setTimeout(() => { moved = false; }, 0); }
  };
  mapEl.addEventListener("pointerup", end);
  mapEl.addEventListener("pointercancel", end);
  mapEl.addEventListener("click", e => { if (moved && !inUi(e.target)){ e.stopPropagation(); e.preventDefault(); } }, true);
  mapEl.addEventListener("wheel", e => {
    if (inUi(e.target)) return;
    e.preventDefault();
    zoomAt(mv.w * Math.exp(e.deltaY * 0.0018), e.clientX, e.clientY);
  }, {passive:false});
  if (window.ResizeObserver) new ResizeObserver(() => layoutOverlay()).observe(mapEl);
  pendingFit = [];
}

function relatedTasks(m){
  const out = [];
  for (const set of CH) set.t.forEach((t, i) => {
    const mm = t.m || {};
    const hit = (mm.ids && mm.ids.includes(m.i)) || (m.zone && mm[m.l] && mm[m.l].includes(m.k)) || (mm.layers && mm.layers.includes(m.l));
    if (hit) out.push({set, i});
  });
  return out.slice(0, 6);
}
function pills(it){

function planView(){
  const c = state.chapter;
  const urgent = [], now = [], story = [], bg = [], missed = [], later = [], done = [], pastStory = [];
  for (const a of single()){
    if (isDone(a)){ if (a.from <= c) done.push(a); continue; }
    if (a.from > c){ later.push(a); continue; }
    if (isMissed(a)){ missed.push(a); continue; }
    if (a.kind === "story"){ (a.from === c ? story : pastStory).push(a); continue; }
    const here = (a.steps||[]).map((s,i) => ({...s, i})).filter(s => s.at === c);
    const lastHere = here.some(s => s.last && !stepDone(a, s.i));
    if ((a.missable && a.until === c) || lastHere){ urgent.push({a, here}); continue; }
    if (a.missable || isBest(a,c) || here.some(s => !stepDone(a, s.i))){ now.push({a, here}); continue; }
    bg.push(a);
  }
  let h = "";
  if (pastStory.length){
    h += '<div class="notice"><p>Вы ' + esc(c === POST ? "в эпилоге" : PH[c].when.replace(/^в/, "сейчас в").replace(/^во/, "сейчас во")) + '. Отметить сюжетные достижения пройденных частей (' + pastStory.length + ')?</p><button type="button" class="btn" data-act="markpast">Отметить</button></div>';
  }
  h += section("urgent", "Последний шанс", "После этой части станет недоступно.",
    urgent.length ? '<div class="rows">' + urgent.map(x => card(x.a, {urgent:true, steps:x.here})).join("") + '</div>' : '<div class="rows"><p class="calm-msg">В этой части ничего не сгорает.</p></div>', urgent.length);
  h += section("now", "Сделать в этой части", "Лучший момент или шаги, привязанные к части.",
    now.length ? '<div class="rows">' + now.map(x => card(x.a, {steps:x.here})).join("") + '</div>' : '<div class="rows"><p class="calm-msg">Ничего срочного. Можно заняться фоновыми целями.</p></div>', now.length);
  if (story.length) h += section("story", "По сюжету", "Откроются сами по ходу сюжета.", '<div class="rows">' + story.map(a => card(a)).join("") + '</div>', story.length);
  if (bg.length) h += fold("Можно фоном", bg.length, '<div class="rows">' + bg.map(a => card(a)).join("") + '</div>', true);
  if (missed.length) h += section("urgent", "Упущено", "Окно закрылось в прошлых частях.", '<div class="rows">' + missed.map(a => card(a)).join("") + '</div>', missed.length);
  if (later.length){
    const items = later.slice().sort((x,y) => x.from - y.from).map(a => {
      const hid = hiddenNow(a);
      return '<li><span' + (hid ? ' class="hid"' : '') + '>' + esc(hid ? "Скрытое достижение" : a.ru) + '</span><span class="from">с: ' + esc(PH[a.from].name) + '</span></li>';
    }).join("");
    h += fold("Позже", later.length, '<div class="rows"><ul class="mini">' + items + '</ul></div>', false);
  }
  if (done.length) h += fold("Получено", done.length, '<div class="rows">' + done.map(a => card(a)).join("") + '</div>', false);
  h += '<p class="hint">Достижения Undead Nightmare (10) от частей не зависят — они во вкладке «Все», фильтр «Undead Nightmare».</p>';
  return h;
}

  $("#nSingle").textContent = ds;
  $("#nOnline").textContent = dn;
  $("#barFill").style.width = (100 * (ds + dn) / ACH.length) + "%";
}
function renderDock(){
  $("#tabs").innerHTML = [["plan","План"],["all","Все"],["chal","Испытания"],["map","Карта"]].map(([v,n]) => '<button type="button" data-act="view" data-v="' + v + '" aria-pressed="' + (ui.view === v) + '">' + n + '</button>').join("");
  const c = state.chapter;
  $("#rail").innerHTML = PH.map((p,i) => {
    const hot = i >= c && hotAt(i).length > 0;
    return '<button type="button" class="ph" data-act="chapter" data-ph="' + i + '" aria-pressed="' + (i === c) + '" aria-label="' + esc(p.name + (hot ? ", есть пропускаемое" : "")) + '">' + esc(p.k) + (hot ? '<span class="dot"></span>' : '') + '</button>';
  }).join("");
  const n = hotAt(c).length;
  $("#cap").innerHTML = '<span class="cap-name">' + esc(PH[c].name) + '</span><span class="cap-place">' + esc(PH[c].place) + '</span><span class="cap-hot' + (n ? '' : ' calm') + '">' + (n ? "Горит: " + n : "Ничего не горит") + '</span>';
}
function renderSync(){
  const el = $("#syncLine");
  if (!el) return;
  el.innerHTML = sync === "cloud"
    ? '<b>Синхронизировано.</b> Прогресс хранится в вашем аккаунте Claude и виден на всех устройствах.'
    : (window.claude ? 'Прогресс хранится в этом браузере. Войдите в аккаунт Claude, чтобы он был доступен на всех устройствах.' : 'Прогресс хранится на этом устройстве. Чтобы перенести его на другое, воспользуйтесь кодом прогресса ниже.');
}
function renderSettings(){
  $("#settings").innerHTML =
    '<h2 id="setH">Настройки</h2>' +
    '<label class="switch" for="spoilers"><input type="checkbox" id="spoilers"' + (state.spoilers ? " checked" : "") + '><span>Скрывать спойлеры</span><small>Скрытые достижения Steam и метки будущих частей прячутся, пока вы до них не дошли.</small></label>' +
    '<p class="sync" id="syncLine"></p>' +
    '<div class="xfer"><h2 style="margin:0;font:600 13px/1.2 var(--f-label);letter-spacing:.12em;text-transform:uppercase">Перенос прогресса</h2><p>Скопируйте код и вставьте его на другом устройстве или в другой версии приложения.</p><div class="xfer-row"><button type="button" class="btn" data-act="xcopy">Скопировать код</button></div><label for="xcode" class="vh">Код прогресса</label><textarea id="xcode" placeholder="Вставьте сюда код прогресса"></textarea><div class="xfer-row"><button type="button" class="btn btn-ghost" data-act="ximport">Загрузить код</button></div></div>' +
    '<div><button type="button" class="btn btn-danger' + (resetArmed ? " armed" : "") + '" data-act="reset">' + (resetArmed ? "Нажмите ещё раз — всё сотрётся" : "Сбросить прогресс") + '</button></div>';
  renderSync();
}
function renderFoot(){
  $("#foot").innerHTML = '<p>Неофициальное фанатское приложение, не связано с Rockstar Games. Список и условия — 51 достижение Steam-версии Red Dead Redemption (2024) вместе с Undead Nightmare; русские названия — из локализации трофеев PS4. Окна по частям и лайфхаки собраны из гайдов и сверены между собой, где источники расходятся — метка «Спорно». Названия миссий оставлены на английском, как в большинстве гайдов. Нью-Остин и Вест-Элизабет нарисованы по открытым данным карты RDR2 (public domain), Мексика — схематично.</p><ul>' +
    Object.values(SRC).map(s => '<li><a href="' + s.u + '" target="_blank" rel="noopener">' + esc(s.n) + '</a></li>').join("") + '</ul>';
}
function focusSel(el){
  if (!el || el === document.body) return null;
  if (el.id) return "#" + CSS.escape(el.id);
  const act = el.getAttribute && el.getAttribute("data-act");
  if (!act) return null;
  return '[data-act="' + act + '"]' + ["data-id","data-ph","data-v","data-f","data-key","data-m","data-k","data-z","data-set","data-i","data-g"].filter(n => el.hasAttribute(n)).map(n => '[' + n + '="' + CSS.escape(el.getAttribute(n)) + '"]').join("");
}
function render(){
  const sel = focusSel(document.activeElement);
  renderHeader(); renderDock();
  $("#view").innerHTML = ui.view === "all" ? allView() : (ui.view === "map" ? mapView() : (ui.view === "chal" ? chalView() : planView()));
  if (ui.view === "chal" && ui.cset === "zoo") applyZooFilter();
  if (ui.view === "map"){
    if (!mapEl) buildMap();
    $("#mapSlot").appendChild(mapEl);
    if (pendingFit){ fitTo(pendingFit); pendingFit = null; }
    drawOverlay();
  }
  renderSettings();
  if (sel){ const el = document.querySelector(sel); if (el) el.focus({preventScroll:true}); }
}

/* ---------- Toast ---------- */
let toastTimer = null, undoFn = null;
function toast(text, undo){
  $("#toastText").textContent = text;
  undoFn = undo || null;
  $("#toast").querySelector("button").hidden = !undo;
  $("#toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("#toast").hidden = true; undoFn = null; }, 5000);
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act");
  if (act === "toggle"){
    const id = el.getAttribute("data-id"), a = ACH.find(x => x.id === id);
    const was = !!state.done[id];
    if (was) delete state.done[id]; else state.done[id] = true;
    commit();
    toast((was ? "Снята отметка: " : "Получено: ") + a.ru, () => { if (was) state.done[id] = true; else delete state.done[id]; commit(); });
  } else if (act === "expand"){
    const id = el.getAttribute("data-id");
    expanded.has(id) ? expanded.delete(id) : expanded.add(id);
    render();
  } else if (act === "chapter"){
    state.chapter = Number(el.getAttribute("data-ph"));
    commit();
  } else if (act === "view"){
    ui.view = el.getAttribute("data-v"); lsSet(UI_KEY, ui); render();
  } else if (act === "filter"){
    ui.filter = el.getAttribute("data-f"); lsSet(UI_KEY, ui); render();
  } else if (act === "reveal"){
    revealed.add(el.getAttribute("data-key"));
    const k = el.getAttribute("data-key");
    if (k.startsWith("a:")) expanded.add(k.slice(2));
    render();
  } else if (act === "markpast"){
    const ids = single().filter(a => a.kind === "story" && !isDone(a) && a.from < state.chapter).map(a => a.id);
    ids.forEach(id => state.done[id] = true);
    commit();
    toast("Отмечено сюжетных: " + ids.length, () => { ids.forEach(id => delete state.done[id]); commit(); });
  } else if (act === "reset"){
    if (!resetArmed){
      resetArmed = true; renderSettings();
      clearTimeout(resetTimer); resetTimer = setTimeout(() => { resetArmed = false; renderSettings(); }, 4000);
    } else {
      resetArmed = false; clearTimeout(resetTimer);
      const keep = {chapter: state.chapter, spoilers: state.spoilers};
      state = Object.assign(blank(), keep);
      commit();
      toast("Прогресс сброшен");
    }
  } else if (act === "undo"){
    const f = undoFn; undoFn = null; $("#toast").hidden = true;
    if (f) f();
  } else if (act === "layer"){
    const k = el.getAttribute("data-k");
    ui.layers = ui.layers.includes(k) ? ui.layers.filter(x => x !== k) : ui.layers.concat(k);
    const sm = selM && getMarker(selM);
    if (sm && sm.l === k && !ui.layers.includes(k)) selM = null;
    lsSet(UI_KEY, ui); render();
  } else if (act === "layers"){
    ui.layers = el.getAttribute("data-v") === "all" ? LAYERS.filter(l => !l.dense).map(l => l.k) : [];
    selM = null; lsSet(UI_KEY, ui); render();
  } else if (act === "preset"){
    const P = {chapter:["hideout","stranger","saloon","table","horse","safe","job"], collect:["treasure","legend","buffalo","plant"],
      nature:["legend","buffalo","animal"], services:["store","gun","tailor","saloon"], undead:["unterr","ungrave","untreas","unmyth","unsurv"]};
    const v = el.getAttribute("data-v");
    ui.layers = P[v].slice(); ui.sp = {}; ui.onlyNow = v === "chapter"; selM = null; ui.fopen = false;
    lsSet(UI_KEY, ui); render();
    if (mapEl) mapEl.scrollIntoView({block:"center", behavior:"smooth"});
  } else if (act === "fpanel"){
    ui.fopen = !ui.fopen; lsSet(UI_KEY, ui); render();
  } else if (act === "fdone"){
    ui.fopen = false; lsSet(UI_KEY, ui); render();
    if (mapEl) mapEl.scrollIntoView({block:"center", behavior:"smooth"});
  } else if (act === "spall"){
    const g = el.getAttribute("data-g"); ui.sp[g] = []; lsSet(UI_KEY, ui); render();
  } else if (act === "onlysp"){
    const g = el.getAttribute("data-g"), k = el.getAttribute("data-k");
    ui.sp[g] = [k]; lsSet(UI_KEY, ui); render();
  } else if (act === "zone"){
    selZ = {g: el.getAttribute("data-g"), k: el.getAttribute("data-k")}; selM = null; drawOverlay();
  } else if (act === "zf"){
    ui.zf = el.getAttribute("data-v"); lsSet(UI_KEY, ui); render();
  } else if (act === "fopen"){
    ui.fopen = true; lsSet(UI_KEY, ui); render();
    const fp = document.getElementById("fpanel"); if (fp) fp.scrollIntoView({block:"start", behavior:"smooth"});
  } else if (act === "marker"){
    selZ = null;
    selM = el.getAttribute("data-m"); drawOverlay();
    const b = ovEl.querySelector('[data-m="' + CSS.escape(selM) + '"]'); if (b) b.focus({preventScroll:true});
  } else if (act === "mclose"){
    const was = selM; selM = null; selZ = null; drawOverlay();
    const b = was && ovEl.querySelector('[data-m="' + CSS.escape(was) + '"]'); if (b) b.focus({preventScroll:true});
  } else if (act === "found"){
    const id = el.getAttribute("data-m"), m = getMarker(id);
    if (state.found[id]) delete state.found[id]; else state.found[id] = true;
    commit();
    toast((state.found[id] ? "Отмечено: " : "Снята отметка: ") + m.n);
  } else if (act === "zs" || act === "zk"){
    const k = el.getAttribute("data-k"), box = state[act], nm = ZMAP[k].ru;
    if (box[k]) delete box[k]; else box[k] = true;
    commit();
    toast((box[k] ? (act === "zs" ? "Изучено: " : "Освежёвано: ") : "Снята отметка: ") + nm);
  } else if (act === "zmap"){
    showOnMap({animal:[el.getAttribute("data-k")]});
  } else if (act === "tmap"){
    const set = CHMAP[el.getAttribute("data-set")], t = set.t[+el.getAttribute("data-i")];
    showOnMap(t.m);
  } else if (act === "cset"){
    ui.cset = el.getAttribute("data-v"); lsSet(UI_KEY, ui); render();
  } else if (act === "gochal"){
    ui.view = "chal"; ui.cset = el.getAttribute("data-v"); lsSet(UI_KEY, ui); render(); window.scrollTo({top:0, behavior:"smooth"});
  } else if (act === "gotask"){
    const k = el.getAttribute("data-set"), i = el.getAttribute("data-i");
    ui.view = "chal"; ui.cset = k; lsSet(UI_KEY, ui); render();
    const t = document.getElementById("task-" + k + "-" + i); if (t) t.scrollIntoView({block:"center", behavior:"smooth"});
  } else if (act === "mz"){
    const z = el.getAttribute("data-z");
    if (z === "fit"){ fitTo([]); schedule(); }
    else { const r = mapEl.getBoundingClientRect(); zoomAt(mv.w * (z === "in" ? 1/1.7 : 1.7), r.left + r.width/2, r.top + r.height/2); }
  } else if (act === "showmap"){
    const a = ACH.find(x => x.id === el.getAttribute("data-id"));
    showOnMap({layers: a.layers.slice()});
  } else if (act === "xcopy"){
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(serialize()))));
    const ta = $("#xcode");
    const done = () => toast("Код прогресса скопирован");
    try { navigator.clipboard.writeText(code).then(done, () => { ta.value = code; ta.select(); toast("Код в поле ниже — скопируйте его вручную"); }); }
    catch(_) { ta.value = code; ta.select(); toast("Код в поле ниже — скопируйте его вручную"); }
  } else if (act === "ximport"){
    const raw = ($("#xcode").value || "").trim();
    try {
      const o = JSON.parse(decodeURIComponent(escape(atob(raw))));
      if (!o || typeof o !== "object" || !o.done) throw 0;
      const prev = serialize();
      state = normalize(o); commit();
      toast("Прогресс загружен", () => { state = normalize(prev); commit(); });
    } catch(_) { toast("Не получилось прочитать код. Проверьте, что он скопирован целиком."); }
  } else if (act === "goach"){
    const id = el.getAttribute("data-id");
    ui.view = "all"; ui.filter = "all"; expanded.add(id); lsSet(UI_KEY, ui);
    render();
    const c = document.getElementById("a-" + id);
    if (c) c.scrollIntoView({block:"start", behavior:"smooth"});
  }
});
function applyZooFilter(){
  const q = (ui.zq || "").trim().toLowerCase();
  document.querySelectorAll("#zooList .zrow").forEach(r => { r.hidden = !!q && !r.dataset.n.includes(q); });
  document.querySelectorAll("#zooList .zgrp").forEach(g => { g.hidden = !g.querySelector(".zrow:not([hidden])"); });
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.classList && t.classList.contains("spk-q")){
    const q = t.value.trim().toLowerCase();
    t.closest(".spk").querySelectorAll(".spk-row").forEach(r => { r.hidden = !!q && !r.dataset.n.includes(q); });
  } else if (t.id === "zq"){
    ui.zq = t.value; lsSet(UI_KEY, ui); applyZooFilter();
  }
});
document.addEventListener("toggle", e => {
  const d = e.target;
  if (d.classList && d.classList.contains("spk-d")){ ui.spopen = d.open ? d.dataset.g : (ui.spopen === d.dataset.g ? null : ui.spopen); lsSet(UI_KEY, ui); }
  else if (d.classList && d.classList.contains("rules")){ ui.rulesOpen = d.open; lsSet(UI_KEY, ui); }
}, true);
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches && t.matches("input[data-step]")){
    const k = t.getAttribute("data-step");
    if (t.checked) state.steps[k] = true; else delete state.steps[k];
    commit();
  } else if (t.id === "spoilers"){
    state.spoilers = t.checked; revealed.clear(); commit();
  } else if (t.matches && t.matches("input[data-ch]")){
    const k = t.getAttribute("data-ch");
    if (t.checked) state.ch[k] = true; else delete state.ch[k];
    commit();
  } else if (t.matches && t.matches("input[data-sp]")){
    const [g, k] = t.getAttribute("data-sp").split(":");
    const cur = spList(g).filter(x => x !== k);
    if (t.checked) cur.push(k);
    ui.sp[g] = cur; lsSet(UI_KEY, ui);
    const sum = t.closest("details") && t.closest("details").querySelector("summary");
    if (sum) sum.textContent = LMAP[g].n + ": " + (cur.length ? "выбрано видов — " + cur.length : "выберите виды");
    
    if (!cur.includes(selZ && selZ.k)) selZ = null;
    drawOverlay();
    const mc = document.querySelector('.activechips[aria-label="Виды на карте"]');
    if (mc){ const zs = selectedZones(); mc.innerHTML = zs.map((z, i) => '<button type="button" class="achip" data-act="zone" data-g="' + z.g + '" data-k="' + z.k + '"><span class="zsw sm ' + zoneColor(i) + '"></span>' + esc(z.it.ru) + '</button>').join(""); }
  } else if (t.id === "fHideFound" || t.id === "fOnlyNow"){
    ui[t.id === "fHideFound" ? "hideFound" : "onlyNow"] = t.checked; lsSet(UI_KEY, ui); drawOverlay();
  } else if (t.id === "zLeft"){
    ui.zLeft = t.checked; lsSet(UI_KEY, ui); render();
  }
});

renderFoot();
render();
connect();

</script>
<script>if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body></html>
